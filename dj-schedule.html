<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Pulse — DJ Schedule Board</title>
<style>
  :root{
    --bg:#0b0b14; --panel:#14142a; --panel2:#1c1c38; --accent:#b026ff;
    --accent2:#00e5ff; --text:#e8e8ff; --dim:#8a8ab0; --good:#3dff9c; --bad:#ff5c7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
  body{background:radial-gradient(ellipse at top,#1a1a35 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding:20px}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
  h1{font-size:1.6rem;letter-spacing:3px;text-transform:uppercase;
     background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:.8rem}
  .btn{background:linear-gradient(135deg,var(--accent),#7a1fd0);border:none;color:#fff;padding:9px 18px;border-radius:8px;
       cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s}
  .btn:hover{filter:brightness(1.2)}
  .btn.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent)}
  .btn.small{padding:5px 12px;font-size:.75rem}
  .btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .btn.good{border-color:var(--good);color:var(--good);background:transparent;border:1px solid var(--good)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  #loginBox{display:none;gap:8px;align-items:center;background:var(--panel);padding:10px;border-radius:10px;margin-bottom:16px;flex-wrap:wrap}
  input,select{background:var(--panel2);border:1px solid #33335c;color:var(--text);padding:8px 10px;border-radius:6px;font-size:.85rem}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid #2a2a55;border-radius:14px;
        padding:16px;position:relative;overflow:hidden;transition:.25s}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
        background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(176,38,255,.25)}
  .card h2{font-size:1.05rem;margin-bottom:6px;color:var(--accent2)}
  .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #2a2a55;font-size:.85rem}
  .row:last-child{border-bottom:none}
  .row b{color:var(--dim);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:1px}
  .genre{display:inline-block;background:rgba(0,229,255,.12);color:var(--accent2);padding:2px 10px;border-radius:20px;font-size:.75rem;margin-top:8px}
  .card-actions{display:flex;gap:6px;margin-top:10px}
  .card-actions .btn{flex:1}
  #editor{display:none;background:var(--panel);border:1px solid #33335c;border-radius:14px;padding:20px;margin-bottom:20px}
  #editor h3{margin-bottom:14px;color:var(--accent2)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .field label{display:block;font-size:.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
  .field input,.field select{width:100%}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 0}
  #statusMsg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--good);color:#000;
             padding:10px 22px;border-radius:8px;font-weight:600;display:none;z-index:99}
  .mode-badge{background:var(--good);color:#000;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:12px;display:none}
  .mode-badge.view{display:inline-block;background:#33335c;color:var(--dim)}
  a.sllink{color:var(--accent2);text-decoration:none}
  a.sllink:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎧 Club Pulse — DJ Schedule</h1>
    <div class="sub">Live schedule board &nbsp;•&nbsp; <span class="mode-badge view" id="modeBadge">VIEW ONLY</span></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="addBtn" style="display:none">＋ Add Slot</button>
    <button class="btn ghost small" id="importBtn" style="display:none">Import</button>
    <button class="btn ghost small" id="exportBtn">Export</button>
    <button class="btn ghost small" id="loginBtn">🔒 DJ Login</button>
  </div>
</header>

<div id="loginBox">
  <span style="font-size:.85rem;color:var(--dim)">DJ password:</span>
  <input type="password" id="pwInput" placeholder="Enter password">
  <button class="btn small" id="doLogin">Login</button>
  <span id="loginErr" style="color:var(--bad);font-size:.8rem"></span>
</div>

<div id="editor">
  <h3 id="editorTitle">Add Schedule Slot</h3>
  <input type="hidden" id="f_id">
  <div class="form-grid">
    <div class="field"><label>DJ Name *</label><input id="f_dj" placeholder="DJ Nova"></div>
    <div class="field"><label>Location / Venue *</label><input id="f_loc" placeholder="Club Pulse Main Stage"></div>
    <div class="field"><label>Host *</label><input id="f_host" placeholder="Host name"></div>
    <div class="field"><label>Date *</label><input id="f_date" type="date"></div>
    <div class="field"><label>Start Time *</label><input id="f_time" type="time"></div>
    <div class="field"><label>End Time</label><input id="f_timeEnd" type="time"></div>
    <div class="field"><label>Music Genre *</label>
      <select id="f_genre">
        <option value="">— choose —</option>
        <option>House</option><option>Techno</option><option>Trance</option>
        <option>EDM</option><option>Hip-Hop / R&B</option><option>Rock</option>
        <option>Country</option><option>Pop / Top 40</option><option>80s / Retro</option>
        <option>Dubstep / Bass</option><option>Drum & Bass</option><option>Open Format</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field"><label>SLurl (web: teleport link)</label><input id="f_slurl" placeholder="http://maps.secondlife.com/secondlife/Region/128/128/22"></div>
    <div class="field"><label>Landmark UUID (in-game teleport)</label><input id="f_lm" placeholder="Copy from landmark inventory (right-click > Copy Asset UUID)"></div>
  </div>
  <div style="margin-top:16px;display:flex;gap:10px">
    <button class="btn" id="saveBtn">💾 Save Slot</button>
    <button class="btn ghost" id="cancelBtn">Cancel</button>
  </div>
</div>

<div class="grid" id="board"></div>
<div id="statusMsg"></div>

<script>
/* ================= CONFIG ================= */
const ADMIN_PASSWORD = "djadmin";   // <-- CHANGE THIS to your DJ password
const LS_KEY = "djScheduleBoard_v1";

/* ================= STATE ================= */
let entries = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
let isAdmin = sessionStorage.getItem("djAdmin") === "1";

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(entries));

function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}

function render(){
  entries.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const board = $("board");
  board.innerHTML = "";
  if(!entries.length){
    board.innerHTML = `<div class="empty">No events scheduled yet. 🎶<br><small>Log in as DJ to add slots.</small></div>`;
  }
  for(const e of entries){
    const card = document.createElement("div");
    card.className = "card";
    const lmBtn = (isAdmin && e.lm)
      ? `<button class="btn small good" onclick="giveLandmark('${e.lm}')">📍 Give Landmark</button>` : "";
    const slurlLink = e.slurl
      ? `<a class="sllink" href="${esc(e.slurl)}" target="_blank">🌐 Teleport (web)</a>` : "—";
    card.innerHTML = `
      <h2>🎧 ${esc(e.dj)}</h2>
      <div class="row"><b>Location</b><span>${esc(e.loc)}</span></div>
      <div class="row"><b>Host</b><span>${esc(e.host)}</span></div>
      <div class="row"><b>Date</b><span>${fmtDate(e.date)}</span></div>
      <div class="row"><b>Time</b><span>${esc(e.time)}${e.timeEnd ? " – " + esc(e.timeEnd) : ""}</span></div>
      <div class="row"><b>Teleport</b><span>${slurlLink}</span></div>
      ${isAdmin ? `<div class="row"><b>Landmark UUID</b><span style="font-size:.7rem;word-break:break-all">${esc(e.lm||"—")}</span></div>`:""}
      <div class="genre">${esc(e.genre)}</div>
      ${isAdmin ? `<div class="card-actions">
        ${lmBtn}
        <button class="btn small" onclick="editEntry('${e.id}')">✏️ Edit</button>
        <button class="btn small danger" onclick="delEntry('${e.id}')">🗑</button>
      </div>`:""}
    `;
    board.appendChild(card);
  }
  // admin UI
  $("addBtn").style.display = isAdmin ? "" : "none";
  $("importBtn").style.display = isAdmin ? "" : "none";
  $("loginBtn").textContent = isAdmin ? "🔓 Logout" : "🔒 DJ Login";
  $("modeBadge").textContent = isAdmin ? "EDIT MODE" : "VIEW ONLY";
  $("modeBadge").className = "mode-badge" + (isAdmin ? "" : " view");
}

/* Landmark give in SL: uses the llinventory scheme — works inside Second Life media */
function giveLandmark(uuid){
  // Opens the landmark floater in the SL viewer
  window.location.href = "secondlife:///app/landmark/" + uuid;
  flash("Requested landmark: " + uuid);
}

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  $("editorTitle").textContent = "Edit Schedule Slot";
  for(const k of ["id","dj","loc","host","date","time","timeEnd","genre","slurl","lm"])
    $("f_"+k).value = e[k] || "";
  $("editor").style.display = "block";
  $("editor").scrollIntoView({behavior:"smooth"});
}
function delEntry(id){
  if(!confirm("Delete this slot?")) return;
  entries = entries.filter(x=>x.id!==id);
  save(); render(); flash("Slot deleted");
}
$("addBtn").onclick = () => {
  $("editorTitle").textContent = "Add Schedule Slot";
  ["f_dj","f_loc","f_host","f_date","f_time","f_timeEnd","f_slurl","f_lm"].forEach(i=>$(i).value="");
  $("f_genre").value = "";
  $("f_id").value = "";
  $("editor").style.display = "block";
  $("editor").scrollIntoView({behavior:"smooth"});
};
$("cancelBtn").onclick = () => $("editor").style.display = "none";

$("saveBtn").onclick = () => {
  const req = ["dj","loc","host","date","time","genre"];
  for(const k of req){
    if(!$("f_"+k).value.trim()){ flash("Please fill: " + k.toUpperCase()); return; }
  }
  const data = {
    id: $("f_id").value || Date.now().toString(36),
    dj: $("f_dj").value.trim(), loc: $("f_loc").value.trim(), host: $("f_host").value.trim(),
    date: $("f_date").value, time: $("f_time").value, timeEnd: $("f_timeEnd").value,
    genre: $("f_genre").value, slurl: $("f_slurl").value.trim(), lm: $("f_lm").value.trim()
  };
  const i = entries.findIndex(x=>x.id===data.id);
  if(i>=0) entries[i]=data; else entries.push(data);
  save(); render();
  $("editor").style.display = "none";
  flash("Slot saved ✔");
};

/* login */
$("loginBtn").onclick = () => {
  if(isAdmin){ isAdmin=false; sessionStorage.removeItem("djAdmin"); render(); return; }
  $("loginBox").style.display = $("loginBox").style.display==="flex" ? "none" : "flex";
};
$("doLogin").onclick = () => {
  if($("pwInput").value === ADMIN_PASSWORD){
    isAdmin = true; sessionStorage.setItem("djAdmin","1");
    $("loginBox").style.display="none"; $("pwInput").value=""; $("loginErr").textContent="";
    render(); flash("Welcome back, DJ! 🎛️");
  } else {
    $("loginErr").textContent = "Wrong password";
  }
};
$("pwInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("doLogin").click(); });

/* export / import */
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(entries,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "dj-schedule.json"; a.click();
};
$("importBtn").onclick = () => {
  const inp = document.createElement("input");
  inp.type="file"; inp.accept=".json";
  inp.onchange = () => {
    const r = new FileReader();
    r.onload = () => {
      try{
        const data = JSON.parse(r.result);
        if(Array.isArray(data)){ entries = data; save(); render(); flash("Schedule imported ✔"); }
      }catch(e){ flash("Invalid file"); }
    };
    r.readAsText(inp.files[0]);
  };
  inp.click();
};

function flash(msg){
  const s = $("statusMsg");
  s.textContent = msg; s.style.display = "block";
  clearTimeout(s._t); s._t = setTimeout(()=>s.style.display="none", 2500);
}

render();
</script>
</body>
</html>
