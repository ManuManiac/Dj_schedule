<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Club Pulse - DJ Schedule Board</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #eee; margin: 0; padding: 20px; }
  .container { max-width: 900px; margin: auto; }
  h1 { text-align: center; color: #0ff; text-shadow: 0 0 10px #0ff; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .btn { background: #0ff; color: #000; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 10px #0ff; }
  .btn:hover { background: #fff; }
  .btn-danger { background: #f0f; color: #fff; box-shadow: 0 0 10px #f0f; }
  .btn-secondary { background: #333; color: #0ff; border: 1px solid #0ff; box-shadow: none; }
  .slot { background: rgba(20, 20, 40, 0.8); border: 1px solid #0ff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
  .slot h3 { margin: 0 0 10px 0; color: #f0f; text-shadow: 0 0 5px #f0f; }
  .slot p { margin: 5px 0; color: #ccc; }
  .slot .label { color: #0ff; font-weight: bold; }
  .teleport-link { color: #0f0; text-decoration: none; font-weight: bold; text-shadow: 0 0 5px #0f0; }
  #loginArea, #editArea { background: rgba(20, 20, 40, 0.9); border: 1px solid #f0f; padding: 25px; border-radius: 8px; margin-bottom: 25px; display: none; box-shadow: 0 0 20px rgba(255, 0, 255, 0.3); }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; color: #0ff; font-weight: bold; }
  .form-group input, .form-group select { width: 100%; padding: 10px; background: #111; border: 1px solid #0ff; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #f0f; box-shadow: 0 0 5px #f0f; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>Club Pulse - DJ Schedule</h1>
    <div id="authControls">
      <button class="btn" id="loginBtn">DJ Login</button>
      <button class="btn btn-secondary hidden" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div id="loginArea">
    <h2 style="color:#f0f; text-align:center;">DJ Login</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="dj@clubpulse.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword">
    </div>
    <button class="btn" id="submitLogin" style="width:100%;">Login</button>
    <p id="loginError" style="color:#f33; text-align:center; display:none; margin-top:10px;"></p>
  </div>

  <div id="editArea">
    <h2 id="editTitle" style="color:#0ff; text-align:center;">Add Schedule Slot</h2>
    <input type="hidden" id="editId">
    <div class="form-group"><label>DJ Name *</label><input type="text" id="fDj" required></div>
    <div class="form-group"><label>Location / Venue *</label><input type="text" id="fLocation" required></div>
    <div class="form-group"><label>Host *</label><input type="text" id="fHost" required></div>
    <div class="form-group"><label>Date *</label><input type="date" id="fDate" required></div>
    <div class="form-group"><label>Start Time *</label><input type="time" id="fStart" required></div>
    <div class="form-group"><label>End Time</label><input type="time" id="fEnd"></div>
    <div class="form-group">
      <label>Music Genre *</label>
      <select id="fGenre" required>
        <option value="">choose</option>
        <option value="House">House</option>
        <option value="Techno">Techno</option>
        <option value="Trance">Trance</option>
        <option value="EDM">EDM</option>
        <option value="Hip-Hop / R&B">Hip-Hop / R&B</option>
        <option value="Rock">Rock</option>
        <option value="Country">Country</option>
        <option value="Pop / Top 40">Pop / Top 40</option>
        <option value="80s / Retro">80s / Retro</option>
        <option value="Dubstep / Bass">Dubstep / Bass</option>
        <option value="Drum & Bass">Drum & Bass</option>
        <option value="Open Format">Open Format</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group"><label>SLurl (web: teleport link)</label><input type="text" id="fSlurl" placeholder="http://maps.secondlife.com/..."></div>
    <div class="form-group"><label>Landmark UUID (in-game teleport)</label><input type="text" id="fLandmark" placeholder="00000000-0000-0000-0000-000000000000"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="saveSlot" style="flex:1;">💾 Save Slot</button>
      <button class="btn btn-secondary" id="cancelEdit" style="flex:1;">Cancel</button>
    </div>
  </div>

  <div id="scheduleList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // PASTE YOUR FIREBASE CONFIG HERE
  // Your web app's Firebase configuration

const firebaseConfig = {

  apiKey: "AIzaSyDiDb1kbE-HCUqtRxoFynhX6t7X0D3icXY",

  authDomain: "dj-schedule-board.firebaseapp.com",

  projectId: "dj-schedule-board",

  storageBucket: "dj-schedule-board.firebasestorage.app",

  messagingSenderId: "324584717998",

  appId: "1:324584717998:web:d8dce2afb63cac617df73f"

};


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const colRef = collection(db, "schedule");

  let isAdmin = false;
  let currentSlots = [];

  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginArea = document.getElementById('loginArea');
  const editArea = document.getElementById('editArea');
  const scheduleList = document.getElementById('scheduleList');

  loginBtn.onclick = () => { loginArea.style.display = 'block'; };
  logoutBtn.onclick = () => { signOut(auth); };

  document.getElementById('submitLogin').onclick = async () => {
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPassword').value;
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      loginArea.style.display = 'none';
    } catch (e) {
      document.getElementById('loginError').innerText = e.message;
      document.getElementById('loginError').style.display = 'block';
    }
  };

  document.getElementById('cancelEdit').onclick = () => {
    editArea.style.display = 'none';
    document.getElementById('editTitle').innerText = 'Add Schedule Slot';
    document.getElementById('editId').value = '';
    ['fDj','fLocation','fHost','fDate','fStart','fEnd','fGenre','fSlurl','fLandmark'].forEach(id => document.getElementById(id).value = '');
  };

  document.getElementById('saveSlot').onclick = async () => {
    const data = {
      dj: document.getElementById('fDj').value,
      location: document.getElementById('fLocation').value,
      host: document.getElementById('fHost').value,
      date: document.getElementById('fDate').value,
      start: document.getElementById('fStart').value,
      end: document.getElementById('fEnd').value,
      genre: document.getElementById('fGenre').value,
      slurl: document.getElementById('fSlurl').value,
      landmark: document.getElementById('fLandmark').value
    };
    
    if(!data.dj || !data.location || !data.host || !data.date || !data.start || !data.genre) {
      alert("Please fill in all required fields marked with *");
      return;
    }

    const editId = document.getElementById('editId').value;
    try {
      if (editId) {
        await updateDoc(doc(db, "schedule", editId), data);
      } else {
        await addDoc(colRef, data);
      }
      document.getElementById('cancelEdit').click();
    } catch (e) {
      alert("Error saving: " + e.message);
    }
  };

  onAuthStateChanged(auth, (user) => {
    isAdmin = !!user;
    loginBtn.classList.toggle('hidden', isAdmin);
    logoutBtn.classList.toggle('hidden', !isAdmin);
    renderSlots();
  });

  onSnapshot(query(colRef, orderBy("date", "asc")), (snapshot) => {
    currentSlots = [];
    snapshot.forEach(docSnap => {
      currentSlots.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderSlots();
  });

  function renderSlots() {
    scheduleList.innerHTML = '';
    if (currentSlots.length === 0) {
      scheduleList.innerHTML = '<p style="text-align:center; color:#888;">No scheduled slots yet.</p>';
      if(isAdmin) {
         scheduleList.innerHTML += '<div style="text-align:center; margin-top:20px;"><button class="btn" onclick="document.getElementById(\'editArea\').style.display=\'block\'">+ Add Slot</button></div>';
      }
      return;
    }
    
    if(isAdmin) {
      const addBtnDiv = document.createElement('div');
      addBtnDiv.style.textAlign = 'center';
      addBtnDiv.style.marginBottom = '20px';
      addBtnDiv.innerHTML = '<button class="btn" onclick="document.getElementById(\'editTitle\').innerText=\'Add Schedule Slot\'; document.getElementById(\'editId\').value=\'\'; [\'fDj\',\'fLocation\',\'fHost\',\'fDate\',\'fStart\',\'fEnd\',\'fGenre\',\'fSlurl\',\'fLandmark\'].forEach(id => document.getElementById(id).value = \'\'); document.getElementById(\'editArea\').style.display=\'block\'">+ Add Slot</button>';
      scheduleList.appendChild(addBtnDiv);
    }

    currentSlots.forEach(slot => {
      const div = document.createElement('div');
      div.className = 'slot';
      let html = `<h3>${slot.dj} - ${slot.genre}</h3>`;
      html += `<p><span class="label">Date:</span> ${slot.date} | <span class="label">Time:</span> ${slot.start} - ${slot.end || 'TBA'}</p>`;
      html += `<p><span class="label">Location:</span> ${slot.location} | <span class="label">Host:</span> ${slot.host}</p>`;
      if (slot.slurl) html += `<p><a href="${slot.slurl}" target="_blank" class="teleport-link">🌐 Teleport (web)</a></p>`;
      if (isAdmin) {
        html += `<div style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">`;
        html += `<button class="btn" onclick="window.editSlot('${slot.id}')">Edit</button> `;
        html += `<button class="btn btn-danger" onclick="window.deleteSlot('${slot.id}')">Delete</button>`;
        html += `</div>`;
      }
      div.innerHTML = html;
      scheduleList.appendChild(div);
    });
  }

  window.editSlot = (id) => {
    const slot = currentSlots.find(s => s.id === id);
    if (!slot) return;
    document.getElementById('editTitle').innerText = 'Edit Schedule Slot';
    document.getElementById('editId').value = id;
    document.getElementById('fDj').value = slot.dj || '';
    document.getElementById('fLocation').value = slot.location || '';
    document.getElementById('fHost').value = slot.host || '';
    document.getElementById('fDate').value = slot.date || '';
    document.getElementById('fStart').value = slot.start || '';
    document.getElementById('fEnd').value = slot.end || '';
    document.getElementById('fGenre').value = slot.genre || '';
    document.getElementById('fSlurl').value = slot.slurl || '';
    document.getElementById('fLandmark').value = slot.landmark || '';
    editArea.style.display = 'block';
    window.scrollTo(0, 0);
  };

  window.deleteSlot = async (id) => {
    if (confirm("Delete this slot?")) {
      await deleteDoc(doc(db, "schedule", id));
    }
  };
</script>
</body>
</html>
